<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>נקודות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EA;
    --paper-dark:#EFEADB;
    --ink:#22304A;
    --ink-soft:#4B5C79;
    --line:#D9D2BC;
    --gold:#B8902E;
    --gold-bright:#D8AC3E;
    --gold-bg:#FBF1D9;
    --green:#2E7D4F;
    --green-bg:#E3F3E9;
    --danger:#9C3B3B;
    --danger-bg:#F5E4E1;
    --radius:10px;
  }

  * { box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Rubik', sans-serif;
    overflow-x: hidden;
  }

  body{
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%),
      repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(34,48,74,0.035) 39px);
  }

  header{
    padding: 32px 24px 20px;
    text-align:center;
    position: relative;
  }

  header::after{
    content:"";
    display:block;
    width:120px;
    height:3px;
    background: var(--gold);
    margin: 14px auto 0;
    border-radius: 2px;
  }

  h1{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900;
    font-size: clamp(26px, 4vw, 38px);
    margin: 0;
    color: var(--ink);
    letter-spacing: 0.5px;
  }

  .subtitle{
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 6px;
    font-weight: 500;
  }

  .board-col{
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 14px;
    flex: 1 1 480px;
    max-width: 900px;
  }

  .metivta-board-col{
    flex: 1 1 260px;
    max-width: 400px;
  }
  .metivta-board-col thead th{
    font-size: 14px;
    padding: 5px 4px;
  }
  .metivta-board-col td{
    padding: 5px 4px;
  }
  .metivta-board-col .cell-text,
  .metivta-board-col .point-val,
  .metivta-board-col .status-val,
  .metivta-board-col .merged-dropdown-toggle{
    font-size: 14px !important;
    height: auto !important;
    padding: 0 !important;
  }

  .toolbar{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .status{
    font-size: 13px;
    color: var(--ink-soft);
    min-height: 18px;
  }

  button.reset-btn{
    background: var(--paper);
    border: 1.5px solid var(--danger);
    color: var(--danger);
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button.reset-btn:hover{
    background: var(--danger);
    color: var(--paper);
  }
  button.reset-btn:active{ transform: scale(0.97); }

  button.archive-btn{
    background: var(--paper);
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button.archive-btn:hover{
    background: var(--ink);
    color: var(--paper);
  }
  button.archive-btn:active{ transform: scale(0.97); }

  .archive-view{
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .archive-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .archive-title{
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 22px;
    color: var(--ink);
    margin: 0;
  }

  .archive-empty{
    text-align: center;
    color: var(--ink-soft);
    padding: 40px 0;
  }

  .archive-entry{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 2px 0 var(--line), 0 8px 24px rgba(34,48,74,0.08);
    overflow: hidden;
    margin-bottom: 24px;
  }

  .archive-date{
    background: var(--ink);
    color: var(--paper);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 16px;
  }

  .weekly-header-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .weekly-header-row-nowrap{
    flex-wrap: nowrap;
    overflow-x: auto;
  }
  .weekly-header-row-nowrap > *{
    flex-shrink: 0;
  }

  .export-btn{
    background: var(--gold);
    color: var(--ink);
    border: none;
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .export-btn:hover{
    background: var(--gold-bright);
  }

  table.archive-table{
    border-collapse: collapse;
    width: 100%;
  }
  table.archive-table th{
    background: var(--paper-dark);
    font-size: 12.5px;
    font-weight: 700;
    padding: 8px 4px;
    border-bottom: 2px solid var(--gold);
    border-left: 1px solid var(--line);
    text-align: center;
    white-space: nowrap;
  }
  table.archive-table th:first-child{ border-left: none; }
  table.archive-table td{
    text-align: center;
    font-size: 13px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }
  table.archive-table td:first-child{ border-left: none; white-space: nowrap; }
  table.archive-table th:first-child{ white-space: nowrap; }
  table.archive-table tr:nth-child(even){ background: #FCFBF6; }

  .boards{
    display:flex;
    gap: clamp(16px, 2vw, 32px);
    justify-content:center;
    align-items:flex-start;
    flex-wrap: wrap;
    padding: 6px;
    width: 100%;
  }

  .board-wrap{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 2px 0 var(--line), 0 8px 24px rgba(34,48,74,0.08);
    width: 100%;
  }

  .table-scroll{
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
  }

  .board-title{
    background: var(--ink);
    color: var(--paper);
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    padding: 10px;
    letter-spacing: 0.5px;
  }

  table{
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }

  thead th{
    background: var(--paper-dark);
    color: var(--ink);
    font-size: clamp(11px, 4vw, 20px);
    font-weight: 700;
    padding: clamp(4px, 0.8vw, 8px) 6px;
    border-bottom: 2px solid var(--gold);
    border-left: 1px solid var(--line);
    white-space: nowrap;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .th-inner{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  thead th:first-child{ border-left: 1px solid var(--line); border-top-right-radius: 14px; }
  thead th:last-child{ border-top-left-radius: 14px; }
  tbody tr:last-child td:first-child{ border-bottom-right-radius: 14px; }
  tbody tr:last-child td:last-child{ border-bottom-left-radius: 14px; }

  .merged-dropdown{
    position: relative;
    display: inline-block;
    text-align: center;
  }

  .merged-dropdown-toggle{
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    font-size: clamp(11px, 3vw, 20px);
    color: var(--ink);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    max-width: 100%;
    text-align: center;
  }
  .archive-date .merged-dropdown-toggle{
    color: var(--paper);
  }
  .parent-log-link{
    color: var(--gold);
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: underline;
    white-space: nowrap;
  }
  .merged-dropdown-toggle:focus{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .merged-dropdown-list{
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 30;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(34,48,74,0.18);
    min-width: 110px;
    overflow: hidden;
  }
  .merged-dropdown-list.open{
    display: block;
  }
  .merged-dropdown-list-right{
    left: auto;
    right: 0;
  }
  .merged-dropdown-list-up{
    top: auto;
    bottom: 100%;
  }

  .merged-dropdown-option{
    padding: 10px 14px;
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    text-align: center;
    cursor: pointer;
    white-space: nowrap;
  }
  .merged-dropdown-option-all{
    border-top: 1px solid var(--line);
    margin-top: 2px;
    color: var(--gold);
    font-weight: 700;
  }
  .merged-dropdown-option:hover{
    background: var(--gold-bg);
  }

  .parsha-option{
    padding: 0;
    text-align: right;
  }
  .parsha-option-main{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
  }
  .parsha-option-label{
    flex: 1;
  }
  .parsha-option-caret{
    font-size: 0.8em;
    color: var(--ink-soft);
    padding: 4px 6px;
    cursor: pointer;
  }
  .parsha-option-caret::before{
    content: '▸';
  }
  .parsha-option.open .parsha-option-caret::before{
    content: '▾';
  }
  .merged-dropdown-sublist{
    display: none;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .parsha-option.open .merged-dropdown-sublist{
    display: block;
  }
  .merged-dropdown-sublist .merged-dropdown-option{
    padding-right: 28px;
    font-size: 0.9em;
    font-weight: 500;
  }
  .merged-dropdown-option-active{
    color: var(--gold);
    font-weight: 700;
  }

  .col-reset-btn{
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    font-size: clamp(12px, 4.5vw, 24px);
    color: var(--ink);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px 8px;
    text-align: center;
  }
  .col-reset-btn:hover{
    color: var(--gold);
  }

  tbody td{
    text-align: center;
    border-bottom: 1px solid var(--line);
    border-left: 1px solid var(--line);
    padding: 11px 2px;
  }
  tbody td:first-child{ border-left: 1px solid var(--line); }

  tbody tr:nth-child(even){ background: #FCFBF6; }
  tbody tr:hover{ background: var(--gold-bg); }

  .num-cell{
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .num-cell .cell-text{
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 5cqw, 36px);
  }

  .cell-text{
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    height: 61px;
    overflow: hidden;
  }

  @keyframes flashYellowBg{
    0%, 100% { background-color: transparent; }
    50% { background-color: #FFD54A; }
  }
  tr.flash-yellow td{
    animation: flashYellowBg 1s ease-in-out 3;
  }

  .total-cell{
    color: var(--ink-soft);
    background: rgba(184,144,46,0.08);
  }
  .total-cell .cell-text{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 800;
    font-size: clamp(16px, 6.5vw, 40px);
  }

  .point-cell{
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s ease;
  }

  .point-cell .point-val{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 800;
    font-size: clamp(16px, 6.5vw, 40px);
    color: var(--ink-soft);
    transition: transform 0.12s ease, color 0.12s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 61px;
    overflow: hidden;
    min-width: 1em;
  }

  .point-cell.active{
    background: var(--green-bg);
  }
  .point-cell.active .point-val{
    color: var(--green);
    transform: scale(1.1);
  }

  .purchase-cell.has-purchases{
    background: var(--danger-bg);
  }
  .purchase-cell.has-purchases .point-val{
    color: var(--danger);
    transform: scale(1.1);
  }

  .minus-cell.has-minus{
    background: var(--danger-bg);
  }
  .minus-cell.has-minus .point-val{
    color: var(--danger);
    transform: scale(1.1);
  }

  .point-cell:active .point-val{
    transform: scale(0.9);
  }

  .status-cell{
    position: relative;
  }
  .status-cell .status-val{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 800;
    font-size: clamp(9px, 2.6vw, 14px);
    line-height: 1.2;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 61px;
    overflow: hidden;
    padding: 0 4px;
  }
  .status-cell.status-ok{
    background: var(--green-bg);
  }
  .status-cell.status-ok .status-val{
    color: var(--green);
    font-size: clamp(14px, 5vw, 24px);
  }
  .status-cell.status-exception{
    background: var(--danger-bg);
  }
  .status-cell.status-exception .status-val{
    color: var(--danger);
  }
  .status-plus-btn{
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.12);
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 18px;
    text-align: center;
    padding: 0;
    cursor: pointer;
  }
  .status-plus-btn:active{
    transform: scale(0.9);
  }

  footer{
    text-align:center;
    padding: 40px 20px 40px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(34,48,74,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-box{
    background: var(--paper);
    border-radius: 14px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    text-align: center;
  }

  .modal-msg{
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .modal-btns{
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .modal-btn{
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1.5px solid transparent;
  }

  .modal-btn-confirm{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .modal-btn-confirm:hover{ opacity: 0.9; }

  .modal-btn-cancel{
    background: var(--paper);
    color: var(--ink-soft);
    border-color: var(--line);
  }
  .modal-btn-cancel:hover{ background: var(--paper-dark); }

  @media (max-width: 720px){
    .boards{ flex-direction: column; align-items: center; }
    .board-wrap{ width: 100%; max-width: 480px; }
  }

  @media (min-width: 900px){
    .archive-view{ max-width: min(96vw, 1800px); }
    .archive-date{ font-size: 17px; padding: 12px 18px; }
    table.archive-table th{ font-size: 18px; padding: 12px 10px; }
    table.archive-table td{ font-size: 17px; padding: 12px 10px; }
  }

  @media (max-width: 200px){
    .col-hide-narrow{ display: none !important; }
    col.col-hide-narrow{ width: 0 !important; }
    col:not(.col-hide-narrow){ width: 33.33% !important; }
  }

  .lock-screen{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .lock-box{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 2px 0 var(--line), 0 8px 24px rgba(34,48,74,0.08);
    padding: 32px 28px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }

  .lock-title{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900;
    font-size: 24px;
    color: var(--ink);
    margin: 0 0 6px;
  }

  .lock-sub{
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  .lock-input{
    width: 100%;
    font-family: 'Rubik', sans-serif;
    font-size: 20px;
    text-align: center;
    letter-spacing: 4px;
    padding: 12px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 10px;
    background: var(--paper);
    color: var(--ink);
  }
  .lock-input:focus{
    outline: none;
    border-color: var(--gold);
  }

  .lock-error{
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div id="appContent">
  <div class="boards" id="boards"></div>

  <div class="archive-view" id="todaySummary" style="padding: 0 20px 20px;"></div>

  <div class="archive-view" id="frequentArchiveView" style="padding: 0 20px 20px;"></div>

  <div class="archive-view" id="metivtaView" style="display:none; padding: 20px 20px;"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, getDocs, collection, setDoc, onSnapshot, runTransaction,
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig, isFirebaseConfigured } from "./firebase-config.js";

function showSetupNeededMessage(){
  document.body.innerHTML = '';
  const box = document.createElement('div');
  box.style.maxWidth = '480px';
  box.style.margin = '60px auto';
  box.style.padding = '28px';
  box.style.fontFamily = "'Rubik', sans-serif";
  box.style.textAlign = 'center';
  box.style.direction = 'rtl';
  box.innerHTML = '<h1 style="font-size:20px;">האתר עדיין לא מוגדר</h1>' +
    '<p>צריך למלא את פרטי החיבור ל-Firebase בקובץ <code>firebase-config.js</code>. ' +
    'ראו את ה-README בריפו להוראות.</p>';
  document.body.appendChild(box);
}

window.addEventListener('error', (ev) => {
  showStartupError(ev.error || ev.message || ev);
});
window.addEventListener('unhandledrejection', (ev) => {
  showStartupError(ev.reason);
});

const CATEGORIES = [
  { key: 'c1', label: '8:10', value: 3 },
  { key: 'c2', label: 'קרבנות', value: 1 },
  { key: 'c3', label: 'תפילה', value: 2 },
  { key: 'c4', label: '11:23', value: 1 },
  { key: 'c5', label: '+', value: 1, resettable: true, cumulativeKey: 'c5Total' },
  { key: 'c6', label: 'מקווה', value: 1 },
  { key: 'c7', label: '8:45', value: 1 },
  { key: 'c8', label: '12:48', value: 1 }
];

const MERGE_GROUPS = [
  ['c1', 'c7', 'c4', 'c8'],
  ['c5', 'c2', 'c3', 'mikvaot', 'rambam']
];

// mikvaot/rambam live in the "prayer" merged dropdown (MERGE_GROUPS[1]) but are
// not point categories: they are a checkmark (student.frequent[key]), excluded
// from the daily/overall point sums, and only turn into points (2, via
// student.frequentFrozen) inside the "הנוסע המתמיד" weekly archive.
const FREQUENT_TOGGLE_LABELS = { mikvaot: 'מקוואות', rambam: 'רמב"ם' };

function isFrequentToggleKey(key){
  return key === 'mikvaot' || key === 'rambam';
}

function categoryLabel(key){
  if (isFrequentToggleKey(key)) return FREQUENT_TOGGLE_LABELS[key];
  const cat = CATEGORIES.find(c => c.key === key);
  return cat ? cat.label : '';
}

const STUDENT_NAMES = [
  'צאלי', 'ישרוליק', 'נתנאל', 'מענדי ה.', 'מענדי ח.', 'אלעאי', 'יהונתן', 'איתן', 'מענדי ל.', 'שלוימי', 'מוישלה', 'לוי ס.',
  'שמוליק ע.', 'מולי', 'שלום', 'חננאל', 'שמוליק צ.', 'אושר', 'שמעון', 'מוטי', 'לוי ק.', 'נועם', 'משה'
];

function studentName(id){
  return STUDENT_NAMES[id - 1] || id;
}

const TOTAL_STUDENTS = 23;
const STORAGE_KEY = 'classroom-points-v1';
const FIRESTORE_COLLECTION = 'classroom_points';

const firebaseApp = isFirebaseConfigured ? initializeApp(firebaseConfig) : null;
const firestoreDb = firebaseApp ? getFirestore(firebaseApp) : null;

// Data model: the archive (daily point-history + the weekly "הנוסע המתמיד"
// entries) lives in its own documents, separate from the live, constantly-
// written "today" document below. A live point click never touches the
// archive at all, and every archive write re-reads the specific archive
// document fresh before changing it - so a device with an out-of-date copy
// of the archive can never silently overwrite someone else's newer archive
// data with its own stale copy (which is what caused a real data-loss
// incident: the old design kept the whole archive embedded in the one
// live document, and any ordinary save pushed back whatever archive this
// device last happened to load).
const stateDocRef = firestoreDb ? doc(firestoreDb, FIRESTORE_COLLECTION, STORAGE_KEY) : null;
const dailyArchiveDocRef = firestoreDb ? doc(firestoreDb, FIRESTORE_COLLECTION, STORAGE_KEY, 'meta', 'dailyArchive') : null;
const weeklyArchiveCollectionRef = firestoreDb ? collection(firestoreDb, FIRESTORE_COLLECTION, STORAGE_KEY, 'archiveWeeks') : null;
function weekDocRef(weekKey){
  return doc(firestoreDb, FIRESTORE_COLLECTION, STORAGE_KEY, 'archiveWeeks', weekKey);
}

let lastSyncedMainJson = null;

async function fetchArchiveDays(){
  try{
    const snap = await getDoc(dailyArchiveDocRef);
    if (snap.exists() && Array.isArray(snap.data().days)) return snap.data().days;
  } catch(e){}
  return [];
}

async function fetchArchiveWeeks(){
  try{
    const snaps = await getDocs(weeklyArchiveCollectionRef);
    const list = [];
    snaps.forEach(s => list.push(s.data()));
    return list;
  } catch(e){}
  return [];
}

// One-time split of a pre-existing document that still has the archive
// embedded in it (the old format) into the new, separate archive documents.
// A stale browser tab still running the pre-split code (loaded before this
// change shipped, never refreshed) has no idea about archiveSplitV1 - an
// ordinary save from it can write the main doc back without that flag,
// making this run again long after the real split already happened. At that
// point mainData.archive no longer exists (the first split deleted it), so
// treating that as "there was never anything to migrate" would silently
// wipe the already-split daily archive and weekly docs. Guard against that
// by checking whether the daily archive doc already exists - if it does,
// the split already happened and this only needs to stamp the flag back
// onto the main doc, never touch the archive documents again.
async function migrateArchiveSplitIfNeeded(mainData){
  if (mainData.archiveSplitV1) return mainData;
  try{
    const alreadySplitSnap = await getDoc(dailyArchiveDocRef);
    if (!alreadySplitSnap.exists()){
      const oldArchive = Array.isArray(mainData.archive) ? mainData.archive : [];
      const days = oldArchive.filter(e => e.type !== 'weekly');
      const weeks = oldArchive.filter(e => e.type === 'weekly');
      await setDoc(dailyArchiveDocRef, { days });
      for (const w of weeks){
        await setDoc(weekDocRef(w.weekKey), w);
      }
    }
    const mainUpdate = JSON.parse(JSON.stringify(mainData));
    delete mainUpdate.archive;
    mainUpdate.archiveSplitV1 = true;
    await setDoc(stateDocRef, mainUpdate);
    return mainUpdate;
  } catch(e){
    // leave the old embedded archive in place; this will simply be retried
    // on the next load.
    return mainData;
  }
}

// Deliberately does not swallow errors into a null return - a transient
// read failure must never look identical to "this document genuinely
// doesn't exist yet", because loadState() treats the latter as license to
// start from a blank slate. Confusing the two let a normal page load, on a
// bad network blip, silently initialize with empty data that a single
// subsequent save would then write over the real board.
async function storageGet(){
  const snap = await getDoc(stateDocRef);
  if (!snap.exists()) return null;
  let mainData = snap.data();
  if (!mainData.archiveSplitV1){
    mainData = await migrateArchiveSplitIfNeeded(mainData);
  }
  lastSyncedMainJson = JSON.stringify(mainData);
  const [days, weeks] = await Promise.all([fetchArchiveDays(), fetchArchiveWeeks()]);
  mainData = JSON.parse(JSON.stringify(mainData));
  mainData.archive = [...days, ...weeks];
  return { value: JSON.stringify(mainData) };
}

async function storageSet(value){
  try{
    const body = JSON.parse(value);
    delete body.archive;
    await setDoc(stateDocRef, body);
    lastSyncedMainJson = JSON.stringify(body);
    return { ok: true };
  } catch(e){
    return null;
  }
}

async function refreshArchiveAndRender(){
  const [days, weeks] = await Promise.all([fetchArchiveDays(), fetchArchiveWeeks()]);
  state.archive = [...days, ...weeks];
  if (document.getElementById('frequentArchiveView').style.display !== 'none') renderFrequentFlyerView();
  if (document.getElementById('metivtaView').style.display !== 'none') renderMetivtaView();
}

function subscribeToRemoteStateChanges(){
  onSnapshot(stateDocRef, (snap) => {
    if (!snap.exists() || snap.metadata.hasPendingWrites) return;
    const json = JSON.stringify(snap.data());
    if (json === lastSyncedMainJson) return;
    lastSyncedMainJson = json;
    let parsed;
    try{ parsed = JSON.parse(json); } catch(e){ return; }
    if (!parsed || !Array.isArray(parsed.students) || parsed.students.length !== TOTAL_STUDENTS) return;
    parsed.archive = Array.isArray(state && state.archive) ? state.archive : [];
    state = parsed;
    render();
    refreshArchiveAndRender();
  }, (err) => {
    // realtime sync unavailable; local get/set on next load still works
  });
}

async function loadState(){
  const result = await storageGet();
  if (result && result.value){
    const parsed = JSON.parse(result.value);
    if (parsed && Array.isArray(parsed.students) && parsed.students.length === TOTAL_STUDENTS){
      if (!Array.isArray(parsed.mergedActive) || parsed.mergedActive.length !== MERGE_GROUPS.length){
        parsed.mergedActive = MERGE_GROUPS.map(g => g[0]);
      }
      if (parsed.minusShopActive !== 'minus' && parsed.minusShopActive !== 'shop'){
        parsed.minusShopActive = 'minus';
      }
      parsed.students.forEach(s => {
        if (typeof s.purchases !== 'number') s.purchases = 0;
        if (!s.cats) s.cats = {};
        if (typeof s.cats.c5 !== 'number') s.cats.c5 = 0;
        if (typeof s.cats.c6 !== 'number') s.cats.c6 = 0;
        if (typeof s.cats.c7 !== 'number') s.cats.c7 = 0;
        if (typeof s.cats.c8 !== 'number') s.cats.c8 = 0;
        if (!s.frequent) s.frequent = { mikvaot: 0, rambam: 0 };
        if (!s.frequentFrozen) s.frequentFrozen = { mikvaot: s.frequent.mikvaot || 0, rambam: s.frequent.rambam || 0 };
        if (!s.metivta) s.metivta = { attendance: 0, behavior: 0 };
        if (!s.metivtaFrozen) s.metivtaFrozen = { attendance: s.metivta.attendance || 0, behavior: s.metivta.behavior || 0 };
        if (typeof s.c5Total !== 'number') s.c5Total = 0;
        if (typeof s.minusTotal !== 'number') s.minusTotal = 0;
      });
      if (!Array.isArray(parsed.metivtaExtra) || parsed.metivtaExtra.length !== 23){
        const existing = Array.isArray(parsed.metivtaExtra) ? parsed.metivtaExtra : [];
        const byId = {};
        existing.forEach(s => { byId[s.id] = s; });
        const metivtaExtra = [];
        for (let i = 1; i <= 23; i++){
          metivtaExtra.push(byId[i] || { id: i, metivta: { attendance: 0, behavior: 0 }, metivtaFrozen: { attendance: 0, behavior: 0 } });
        }
        parsed.metivtaExtra = metivtaExtra;
      }
      if (!Array.isArray(parsed.archive)) parsed.archive = [];
      {
        const dailyEntries = parsed.archive.filter(e => e.type !== 'weekly');
        const weeklyEntries = parsed.archive.filter(e => e.type === 'weekly');
        const MAX_DAILY = 90;
        const MAX_WEEKLY = 26;
        if (dailyEntries.length > MAX_DAILY || weeklyEntries.length > MAX_WEEKLY){
          const keptDaily = dailyEntries.slice(0, MAX_DAILY);
          const keptWeekly = weeklyEntries.slice(0, MAX_WEEKLY);
          parsed.archive = parsed.archive.filter(e => keptDaily.includes(e) || keptWeekly.includes(e));
        }
      }
      if (!parsed.testWeekCleanupDone){
        const cleanupPrevWeekStart = getWeekStart(new Date());
        cleanupPrevWeekStart.setDate(cleanupPrevWeekStart.getDate() - 7);
        const cleanupPrevWeekKey = getWeekKey(cleanupPrevWeekStart);
        parsed.archive = parsed.archive.filter(e => !(e.type === 'weekly' && e.weekKey === cleanupPrevWeekKey));
        parsed.testWeekCleanupDone = true;
      }
      if (!parsed.fixTzaali20260908){
        const tzaali = parsed.students.find(s => s.id === 1);
        if (tzaali){
          let plusReduceLeft = 32;
          const c5TotalReduce = Math.min(plusReduceLeft, tzaali.c5Total || 0);
          tzaali.c5Total = (tzaali.c5Total || 0) - c5TotalReduce;
          plusReduceLeft -= c5TotalReduce;
          if (plusReduceLeft > 0 && tzaali.cats){
            const c5Reduce = Math.min(plusReduceLeft, tzaali.cats.c5 || 0);
            tzaali.cats.c5 = (tzaali.cats.c5 || 0) - c5Reduce;
          }
          tzaali.minusTotal = Math.min(0, (tzaali.minusTotal || 0) + 28);
        }
        parsed.fixTzaali20260908 = true;
      }
      if (typeof parsed.lastActivityDate === 'undefined') parsed.lastActivityDate = null;
      if (typeof parsed.lastAutoResetDate === 'undefined') parsed.lastAutoResetDate = null;
      if (!parsed.metivtaNames || typeof parsed.metivtaNames !== 'object') parsed.metivtaNames = {};
      state = parsed;
      return;
    }
    // The document exists but its shape is unexpected - treat this as an
    // error (see storageGet's comment) rather than silently starting blank.
    throw new Error('הנתונים שנטענו מהשרת אינם בפורמט תקין');
  }
  // storageGet() returned null only because the document genuinely doesn't
  // exist yet - the one legitimate case for starting from a blank board.
  state = defaultState();
}

function studentTotal(student){
  const todayCats = CATEGORIES.reduce((sum, c) => sum + (student.cats[c.key] || 0), 0);
  const todayPurchaseCost = (student.purchases || 0) * PURCHASE_COST;
  const todayNet = todayCats + (student.c5Total || 0) + (student.minusTotal || 0) - todayPurchaseCost;

  const archiveDailyEntries = (state.archive || []).filter(e => e.type !== 'weekly');
  const archiveSum = archiveDailyEntries.reduce((sum, entry) => {
    const s = (entry.students || []).find(x => x.id === student.id);
    if (!s) return sum;
    const catsSum = CATEGORIES.reduce((sum2, c) => sum2 + ((s.cats && s.cats[c.key]) || 0), 0);
    const purchaseCost = (s.purchases || 0) * PURCHASE_COST;
    return sum + catsSum + (s.minusTotal || 0) - purchaseCost;
  }, 0);

  return todayNet + archiveSum;
}

// Pure function: computes the result of archiving one day (mainData.lastActivityDate)
// from freshly-read documents, without touching any global state. Used inside
// doResetGuarded's transaction so the whole operation - reading the live
// document, the daily-archive document and the one affected week document,
// and writing all three back - happens atomically from one consistent,
// just-read snapshot of each.
function computeDailyResetUpdate(mainData, dailyDays, weeklyEntry){
  const defaultMetivtaFlags = { ok: false, late: false, leftEarly: false, disturbCount: 0 };
  const entryDate = mainData.lastActivityDate
    ? new Date(mainData.lastActivityDate + 'T12:00:00')
    : new Date();
  const entryDayKey = dayKeyOf(entryDate.toISOString());

  const newDailyData = {
    date: entryDate.toISOString(),
    students: mainData.students.map(s => ({
      id: s.id,
      cats: { ...s.cats },
      purchases: s.purchases || 0,
      minusTotal: s.minusTotal || 0,
      metivtaFlags: { ...(s.metivtaFlags || defaultMetivtaFlags) }
    })),
    metivtaExtraStudents: (mainData.metivtaExtra || []).map(s => ({
      id: s.id,
      metivtaFlags: { ...(s.metivtaFlags || defaultMetivtaFlags) }
    }))
  };

  let days = Array.isArray(dailyDays) ? dailyDays.slice() : [];
  const existingDailyIdx = days.findIndex(e => dayKeyOf(e.date) === entryDayKey);
  if (existingDailyIdx !== -1) days.splice(existingDailyIdx, 1);
  days.unshift(newDailyData);
  const MAX_DAILY = 90;
  if (days.length > MAX_DAILY) days = days.slice(0, MAX_DAILY);

  const weekKey = getWeekKey(entryDate);
  const freshWeeklyStudent = (s) => ({
    id: s.id, morning: 0, tefila: 0, mikve: 0, minusDelta: 0, bonus: 0, days: {},
    baselineMikvaot: s.frequentFrozen ? (s.frequentFrozen.mikvaot || 0) : 0,
    baselineRambam: s.frequentFrozen ? (s.frequentFrozen.rambam || 0) : 0,
    chitas: 0, shema: 0, netilatYadaim: 0, minchaMaariv: 0, mikveh: false, dvarTorah: false
  });
  const weeklyEntryOut = weeklyEntry ? JSON.parse(JSON.stringify(weeklyEntry)) : {
    type: 'weekly',
    title: 'הנוסע המתמיד',
    weekKey: weekKey,
    weekStart: getWeekStart(entryDate).toISOString(),
    date: entryDate.toISOString(),
    students: mainData.students.map(freshWeeklyStudent),
    weekParsha: null
  };
  weeklyEntryOut.date = entryDate.toISOString();
  if (!Array.isArray(weeklyEntryOut.students)) weeklyEntryOut.students = [];

  mainData.students.forEach(s => {
    let ws = weeklyEntryOut.students.find(x => x.id === s.id);
    if (!ws){
      ws = freshWeeklyStudent(s);
      weeklyEntryOut.students.push(ws);
    }
    if (!ws.days) ws.days = {};
    if (typeof ws.baselineMikvaot !== 'number') ws.baselineMikvaot = 0;
    if (typeof ws.baselineRambam !== 'number') ws.baselineRambam = 0;

    const dayMorning = Math.round((s.cats.c1 || 0) * (2 / 3));
    const dayTefila = (s.cats.c7 || 0) + (s.cats.c3 || 0);
    const dayBonus = (s.minusTotal || 0) === 0 ? 1 : 0;

    const priorMikvaotSum = Object.values(ws.days).reduce((sum, d) => sum + (d.mikvaotVal || 0), 0);
    const priorRambamSum = Object.values(ws.days).reduce((sum, d) => sum + (d.rambamVal || 0), 0);

    const currentMikvaot = s.frequentFrozen ? (s.frequentFrozen.mikvaot || 0) : 0;
    const currentRambam = s.frequentFrozen ? (s.frequentFrozen.rambam || 0) : 0;

    const dayMikvaotVal = currentMikvaot - ws.baselineMikvaot - priorMikvaotSum;
    const dayRambamVal = currentRambam - ws.baselineRambam - priorRambamSum;

    const dayMetivtaVal = metivtaDayScore(s.metivtaFlags || defaultMetivtaFlags);

    ws.days[entryDayKey] = {
      morning: dayMorning,
      tefila: dayTefila,
      mikvaotVal: dayMikvaotVal,
      bonus: dayBonus,
      rambamVal: dayRambamVal,
      metivtaVal: dayMetivtaVal
    };

    ws.morning += dayMorning;
    ws.tefila += dayTefila;
    ws.mikve += (s.cats.c6 || 0) * 2;
    ws.minusDelta += s.minusTotal || 0;
    ws.bonus = (ws.bonus || 0) + dayBonus;
    ws.mikvaotVal = currentMikvaot - ws.baselineMikvaot;
    ws.rambamVal = currentRambam - ws.baselineRambam;
    ws.metivtaVal = (ws.metivtaVal || 0) + dayMetivtaVal;
  });

  const newMainData = JSON.parse(JSON.stringify(mainData));
  newMainData.students.forEach(s => {
    const daily = CATEGORIES.reduce((sum, c) => sum + (s.cats[c.key] || 0), 0);
    s.cumulative += daily + (s.minusTotal || 0);
    CATEGORIES.forEach(c => { s.cats[c.key] = 0; });
    s.c5Total = 0;
    s.purchases = 0;
    s.minusTotal = 0;
    s.frequent = { mikvaot: 0, rambam: 0 };
    s.metivta = { attendance: 0, behavior: 0 };
    s.metivtaFlags = { ok: false, late: false, leftEarly: false, disturbCount: 0 };
  });
  (newMainData.metivtaExtra || []).forEach(s => {
    s.metivta = { attendance: 0, behavior: 0 };
    s.metivtaFlags = { ok: false, late: false, leftEarly: false, disturbCount: 0 };
  });
  newMainData.lastAutoResetDate = todayStr();
  newMainData.lastActivityDate = null;

  return { newMainData, newDailyDays: days, newWeeklyEntry: weeklyEntryOut, weekKey };
}

async function doResetGuarded(){
  if (!state.lastActivityDate) return;
  let outcome = null;
  try{
    await runTransaction(firestoreDb, async (tx) => {
      const mainSnap = await tx.get(stateDocRef);
      if (!mainSnap.exists()) return;
      const mainData = mainSnap.data();
      if (!Array.isArray(mainData.students) || mainData.students.length !== TOTAL_STUDENTS) return;
      if (!mainData.lastActivityDate){
        // someone else already archived and reset this transition
        outcome = { mainData, dailyDays: null };
        return;
      }
      const entryDate = new Date(mainData.lastActivityDate + 'T12:00:00');
      const weekKey = getWeekKey(entryDate);
      const weekRef = weekDocRef(weekKey);
      const dailySnap = await tx.get(dailyArchiveDocRef);
      const weekSnap = await tx.get(weekRef);
      const dailyDays = dailySnap.exists() && Array.isArray(dailySnap.data().days) ? dailySnap.data().days : [];
      const weeklyEntry = weekSnap.exists() ? weekSnap.data() : null;

      const computed = computeDailyResetUpdate(mainData, dailyDays, weeklyEntry);
      tx.set(stateDocRef, computed.newMainData);
      tx.set(dailyArchiveDocRef, { days: computed.newDailyDays });
      tx.set(weekRef, computed.newWeeklyEntry);
      outcome = { mainData: computed.newMainData, dailyDays: computed.newDailyDays };
    });
  } catch(e){
    // transaction failed (offline, etc.) - render whatever is in memory so the UI isn't stuck
  }
  if (outcome){
    const days = outcome.dailyDays !== null ? outcome.dailyDays : await fetchArchiveDays();
    const weeks = await fetchArchiveWeeks();
    const newState = JSON.parse(JSON.stringify(outcome.mainData));
    newState.archive = [...days, ...weeks];
    state = newState;
    lastSyncedMainJson = JSON.stringify(outcome.mainData);
  }
  render();
  renderFrequentFlyerView();
  renderMetivtaView();
}

// Manual archive edits (from the teacher's access-code-gated archive UI)
// re-read the specific small document fresh before changing it, instead of
// pushing back whatever this device's in-memory copy of the whole archive
// happens to hold - so an edit here can't silently undo someone else's
// newer change to the same day/week.
async function updateWeekStudentRecord(weekKey, studentId, mutatorFn){
  try{
    setStatus('שומר…');
    await runTransaction(firestoreDb, async (tx) => {
      const ref = weekDocRef(weekKey);
      const snap = await tx.get(ref);
      let data = snap.exists() ? snap.data() : {
        type: 'weekly', title: 'הנוסע המתמיד', weekKey: weekKey,
        weekStart: getWeekStart(new Date(weekKey + 'T12:00:00')).toISOString(),
        date: new Date().toISOString(), students: [], weekParsha: null
      };
      if (!Array.isArray(data.students)) data.students = [];
      let rec = data.students.find(s => s.id === studentId);
      if (!rec){ rec = { id: studentId, days: {} }; data.students.push(rec); }
      mutatorFn(rec);
      tx.set(ref, data);
    });
    setStatus('נשמר');
    setTimeout(() => setStatus(''), 1200);
  } catch(e){
    setStatus('שמירה נכשלה');
    setTimeout(() => setStatus(''), 3000);
  }
}

async function updateDailyArchiveRecord(dayKey, studentId, isExtra, mutatorFn){
  try{
    setStatus('שומר…');
    await runTransaction(firestoreDb, async (tx) => {
      const snap = await tx.get(dailyArchiveDocRef);
      const data = snap.exists() ? snap.data() : { days: [] };
      const days = Array.isArray(data.days) ? data.days : [];
      const entry = days.find(e => dayKeyOf(e.date) === dayKey);
      if (!entry) return;
      if (isExtra && !Array.isArray(entry.metivtaExtraStudents)) entry.metivtaExtraStudents = [];
      if (!isExtra && !Array.isArray(entry.students)) entry.students = [];
      const list = isExtra ? entry.metivtaExtraStudents : entry.students;
      let rec = list.find(x => x.id === studentId);
      if (!rec){ rec = { id: studentId }; list.push(rec); }
      mutatorFn(rec);
      tx.set(dailyArchiveDocRef, { days });
    });
    setStatus('נשמר');
    setTimeout(() => setStatus(''), 1200);
  } catch(e){
    setStatus('שמירה נכשלה');
    setTimeout(() => setStatus(''), 3000);
  }
}

const AUTO_RESET_HOUR = 18;

function checkAutoReset(){
  if (!state) return;
  if (!state.lastActivityDate) return;
  const today = todayStr();
  if (state.lastActivityDate === today){
    if (new Date().getHours() >= AUTO_RESET_HOUR && state.lastAutoResetDate !== today){
      doResetGuarded();
    }
  } else {
    doResetGuarded();
  }
}

function scheduleNextAutoResetCheck(){
  const now = new Date();
  const next = new Date(now);
  next.setHours(1, 0, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  setTimeout(() => {
    checkAutoReset();
    scheduleNextAutoResetCheck();
  }, next.getTime() - now.getTime());
}

function toggleFrequent(studentId, key){
  const student = state.students.find(s => s.id === studentId);
  if (!student) return;
  if (!student.frequent) student.frequent = { mikvaot: 0, rambam: 0 };
  if (!student.frequentFrozen) student.frequentFrozen = { mikvaot: 0, rambam: 0 };
  const turningOn = !student.frequent[key];
  student.frequent[key] = turningOn ? 2 : 0;
  student.frequentFrozen[key] = (student.frequentFrozen[key] || 0) + (turningOn ? 2 : -2);
  markActivity();
  render();
  saveState();
}

function ensureMetivtaFlags(student){
  if (!student.metivtaFlags) student.metivtaFlags = { ok: false, late: false, leftEarly: false, disturbCount: 0 };
  return student.metivtaFlags;
}

function metivtaStatusParts(f){
  if (f.late || f.leftEarly || f.disturbCount > 0){
    const parts = [];
    if (f.late) parts.push('איחור');
    if (f.leftEarly) parts.push('מוקדם');
    if (f.disturbCount > 0) parts.push('הפריע' + (f.disturbCount > 1 ? ' ×' + f.disturbCount : ''));
    return parts;
  }
  return f.ok ? ['✓'] : [];
}

function metivtaStatusLabel(f){
  return metivtaStatusParts(f).join(' · ');
}

function metivtaDayScore(f){
  const attended = f.ok || f.late || f.leftEarly || f.disturbCount > 0;
  if (!attended) return 0;
  let score = 4 - (f.late ? 2 : 0) - (f.leftEarly ? 2 : 0) - 2 * (f.disturbCount || 0);
  if (score < 0) score = 0;
  return score;
}

// Reads an archived day's per-student metivta record without mutating it,
// falling back to the legacy attendance/behavior fields for days archived
// before the flags-based report existed.
function metivtaRecordHasFlags(s){
  const f = s && s.metivtaFlags;
  return !!(f && (f.ok || f.late || f.leftEarly || (f.disturbCount || 0) > 0));
}

function metivtaDayLabelLegacyAware(s){
  if (!s) return '';
  if (metivtaRecordHasFlags(s)) return metivtaStatusLabel(s.metivtaFlags);
  const att = s.metivtaAttendance || 0;
  const beh = s.metivtaBehavior || 0;
  if (!att && !beh) return '';
  return beh ? ('נוכחות ' + att + ', התנהגות ' + beh) : String(att);
}

function metivtaDayScoreLegacyAware(s){
  if (!s) return 0;
  if (metivtaRecordHasFlags(s)) return metivtaDayScore(s.metivtaFlags);
  return (s.metivtaAttendance || 0) + (s.metivtaBehavior || 0);
}

function toggleMetivtaOk(studentId, isExtra){
  const student = findMetivtaStatusStudent(studentId, isExtra);
  if (!student) return;
  const f = ensureMetivtaFlags(student);
  if (f.late || f.leftEarly || f.disturbCount > 0){
    f.late = false;
    f.leftEarly = false;
    f.disturbCount = 0;
    f.ok = true;
  } else {
    f.ok = !f.ok;
  }
  markActivity();
  renderMetivtaView();
  saveState();
}

function showMetivtaStatusExceptionsModal(studentId, isExtra){
  const student = findMetivtaStatusStudent(studentId, isExtra);
  if (!student) return;
  const f = ensureMetivtaFlags(student);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const box = document.createElement('div');
  box.className = 'modal-box';

  const msg = document.createElement('div');
  msg.className = 'modal-msg';
  msg.textContent = 'סמן חריגות:';
  box.appendChild(msg);

  function applyChange(){
    f.ok = false;
    markActivity();
    renderMetivtaView();
    saveState();
  }

  const toggleRow = document.createElement('div');
  toggleRow.className = 'modal-btns';

  function buildToggleBtn(label, flagKey){
    const btn = document.createElement('button');
    function refreshBtn(){
      btn.className = 'modal-btn' + (f[flagKey] ? ' modal-btn-confirm' : ' modal-btn-cancel');
      btn.textContent = label + (f[flagKey] ? ' ✓' : '');
    }
    refreshBtn();
    btn.addEventListener('click', () => {
      f[flagKey] = !f[flagKey];
      refreshBtn();
      applyChange();
    });
    return btn;
  }

  toggleRow.appendChild(buildToggleBtn('איחור', 'late'));
  toggleRow.appendChild(buildToggleBtn('יצא מוקדם', 'leftEarly'));
  box.appendChild(toggleRow);

  const disturbLabel = document.createElement('div');
  disturbLabel.className = 'modal-msg';
  disturbLabel.style.marginTop = '10px';
  disturbLabel.textContent = 'הפרעות: ' + f.disturbCount;
  box.appendChild(disturbLabel);

  const disturbRow = document.createElement('div');
  disturbRow.className = 'modal-btns';

  const minusBtn = document.createElement('button');
  minusBtn.className = 'modal-btn modal-btn-cancel';
  minusBtn.textContent = '−';
  minusBtn.addEventListener('click', () => {
    if (f.disturbCount > 0) f.disturbCount--;
    disturbLabel.textContent = 'הפרעות: ' + f.disturbCount;
    applyChange();
  });
  disturbRow.appendChild(minusBtn);

  const plusBtn = document.createElement('button');
  plusBtn.className = 'modal-btn modal-btn-confirm';
  plusBtn.textContent = '+';
  plusBtn.addEventListener('click', () => {
    f.disturbCount++;
    disturbLabel.textContent = 'הפרעות: ' + f.disturbCount;
    applyChange();
  });
  disturbRow.appendChild(plusBtn);
  box.appendChild(disturbRow);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-btn modal-btn-cancel';
  closeBtn.textContent = 'סגור';
  closeBtn.style.marginTop = '10px';
  closeBtn.addEventListener('click', () => document.body.removeChild(overlay));
  box.appendChild(closeBtn);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

async function exportMetivtaArchiveCSV(days){
  try {
    const headers = ['שם'];
    days.forEach(entry => {
      const d = new Date(entry.date);
      headers.push(formatHebrewDateShort(d));
    });
    const rows = [headers];
    state.students.forEach(student => {
      const row = [metivtaStudentName(student.id)];
      days.forEach(entry => {
        const s = entry.students.find(x => x.id === student.id);
        row.push(metivtaDayLabelLegacyAware(s));
      });
      rows.push(row);
    });
    (state.metivtaExtra || []).forEach(student => {
      const row = [metivtaExtraName(student.id)];
      days.forEach(entry => {
        const s = (entry.metivtaExtraStudents || []).find(x => x.id === student.id);
        row.push(metivtaDayLabelLegacyAware(s));
      });
      rows.push(row);
    });
    const csv = rows.map(row => row.map(cell => {
      const str = String(cell);
      return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
    }).join(',')).join('\r\n');

    const filename = 'מתיבתא-ארכיון_' + todayStr() + '.csv';
    await saveCsvFile(filename, csv);
  } catch (err){
    showModal('שגיאה בהורדה: ' + (err && err.message ? err.message : String(err)), { showCancel: false, confirmText: 'הבנתי' });
  }
}

let metivtaArchiveSortIndex = null;
let metivtaSummaryDayCount = 7;
const METIVTA_SUMMARY_DAY_OPTIONS = [
  { key: 7, label: '7 ימים' },
  { key: 14, label: '14 ימים' },
  { key: 30, label: '30 ימים' },
  { key: null, label: 'הכל' }
];

function computeMetivtaSummary(row, days, dayCount){
  const relevantDays = dayCount === null ? days : days.slice(0, dayCount);
  let onTime = 0, late = 0, leftEarly = 0, disturbed = 0;
  relevantDays.forEach(entry => {
    const rec = row.getRecord(entry);
    if (!rec || !metivtaRecordHasFlags(rec)) return;
    const f = rec.metivtaFlags;
    if (f.late) late++; else onTime++;
    if (f.leftEarly) leftEarly++;
    if (f.disturbCount > 0) disturbed += f.disturbCount;
  });
  const parts = [];
  if (onTime) parts.push(onTime + ' בזמן');
  if (late) parts.push(late + ' איחור');
  if (leftEarly) parts.push(leftEarly + ' מוקדם');
  if (disturbed) parts.push(disturbed + ' הפרעות');
  return parts.length ? parts.join(' · ') : '—';
}

    const weekdaySpan = document.createElement('div');
    weekdaySpan.textContent = d.toLocaleDateString('he-IL', { weekday: 'short' });
    weekdaySpan.style.fontWeight = '400';
    weekdaySpan.style.fontSize = '0.75em';
    weekdaySpan.style.color = 'var(--ink-soft)';
    th.appendChild(dateSpan);
    th.appendChild(weekdaySpan);
    th.addEventListener('click', () => {
      metivtaArchiveSortIndex = dayIndex;
      renderMetivtaHistoryTable(container);
    });
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  const mainRows = state.students.map(student => ({
    id: student.id,
    isExtra: false,
    name: metivtaStudentName(student.id),
    getRecord: (entry) => entry.students.find(x => x.id === student.id) || null,
    ensureRecord: (entry) => entry.students.find(x => x.id === student.id) || null
  }));
  const extraRows = (state.metivtaExtra || []).map(student => ({
    id: student.id,
    isExtra: true,
    name: metivtaExtraName(student.id),
    getRecord: (entry) => (entry.metivtaExtraStudents || []).find(x => x.id === student.id) || null,
    ensureRecord: (entry) => {
      if (!Array.isArray(entry.metivtaExtraStudents)) entry.metivtaExtraStudents = [];
      let s = entry.metivtaExtraStudents.find(x => x.id === student.id);
      if (!s){ s = { id: student.id, metivtaFlags: { ok: false, late: false, leftEarly: false, disturbCount: 0 } }; entry.metivtaExtraStudents.push(s); }
      return s;
    }
  }));

  let allRows = mainRows.concat(extraRows);
  if (metivtaArchiveSortIndex !== null && days[metivtaArchiveSortIndex]){
    const sortEntry = days[metivtaArchiveSortIndex];
    allRows = allRows.slice().sort((a, b) => {
      return metivtaDayScoreLegacyAware(b.getRecord(sortEntry)) - metivtaDayScoreLegacyAware(a.getRecord(sortEntry));
    });
  }

  allRows.forEach(row => {
    const tr = document.createElement('tr');

    nameTd.textContent = row.name;
    tr.appendChild(nameTd);

    const summaryTd = document.createElement('td');
    summaryTd.textContent = computeMetivtaSummary(row, days, metivtaSummaryDayCount);
    summaryTd.style.fontWeight = '700';
    summaryTd.style.whiteSpace = 'nowrap';
    tr.appendChild(summaryTd);

    days.forEach(entry => {
      const rec = row.getRecord(entry);
      const td = document.createElement('td');
      td.textContent = metivtaDayLabelLegacyAware(rec);
      td.style.cursor = 'pointer';
      td.addEventListener('click', () => {
        const targetRec = rec || row.ensureRecord(entry);
        if (!targetRec) return;
        const flags = ensureMetivtaFlags(targetRec);
        const dayKey = dayKeyOf(entry.date);
        promptEditArchiveMetivtaFlags(flags, () => {
          updateDailyArchiveRecord(dayKey, row.id, row.isExtra, (fresh) => {
            fresh.metivtaFlags = { ...flags };
          });
          renderMetivtaHistoryTable(container);
        });
      });
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'table-scroll';
  scrollWrap.appendChild(table);
  wrap.appendChild(scrollWrap);
  container.appendChild(wrap);
}

    const rows = [headers];
    const sumField = (s, field) => Object.values(s.days || {}).reduce((sum, d) => sum + (d[field] || 0), 0);
    entry.students.forEach(s => {
      rows.push([
        studentName(s.id),
        sumField(s, 'morning'),
        sumField(s, 'tefila'),

        sumField(s, 'bonus'),
        sumField(s, 'rambamVal'),
        sumField(s, 'metivtaVal'),
        ...WEEKLY_PARENT_FIELD_DEFS.map(f => f.kind === 'weekly-bool' ? (s[f.field] ? 'כן' : 'לא') : (s[f.field] || 0))
      ]);
    });
    const csv = rows.map(row => row.map(cell => {
      const str = String(cell);
      return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
    }).join(',')).join('\r\n');

    const dateStr = weekStartD.toISOString().slice(0, 10) + '_' + weekEndD.toISOString().slice(0, 10);

}

function getDisplayArchive(){
  const weekKey = getWeekKey(new Date());
  const archive = Array.isArray(state.archive) ? state.archive : [];
  const historical = archive
    .filter(e => e.type !== 'weekly' || e.weekKey !== weekKey)
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  const currentWeekly = archive.find(e => e.type === 'weekly' && e.weekKey === weekKey);
  const weeklyList = currentWeekly ? [currentWeekly] : [];
  return [buildLiveTodayDailyEntry(), ...weeklyList, ...historical];
}

let weeklyArchiveSortField = {};
let weeklyArchiveViewMode = {};

const HEBREW_WEEKDAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

function dayLabelWithinWeek(weekStartD, dayKeyStr){
  const selectedDate = new Date(dayKeyStr);
  const dIdx = Math.round((selectedDate.getTime() - new Date(dayKeyOf(weekStartD.toISOString())).getTime()) / 86400000);
  return HEBREW_WEEKDAY_NAMES[dIdx] ? HEBREW_WEEKDAY_NAMES[dIdx] + ' · ' + formatHebrewDateShort(selectedDate) : dayKeyStr;
}

// One dropdown, nested: the outer list is the parshas/weeks; clicking a
// parsha expands a sub-list of that week's days (or "total") right under it,
// instead of opening a second, separate dropdown.
function buildWeekDaySelectDropdown(allWeeklyEntries, selectedEntry){
  const currentMode = weeklyArchiveViewMode[selectedEntry.weekKey] || 'total';

  const list = document.createElement('div');
  list.className = 'merged-dropdown-list merged-dropdown-list-right';

  allWeeklyEntries.forEach(weekEntry => {
    const weekStartD = new Date(weekEntry.weekStart);
    const isSelectedWeek = weekEntry.weekKey === selectedEntry.weekKey;

    const parshaRow = document.createElement('div');
    parshaRow.className = 'parsha-option' + (isSelectedWeek ? ' open' : '');

    const parshaMain = document.createElement('div');
    parshaMain.className = 'merged-dropdown-option parsha-option-main';

    const parshaLabel = document.createElement('span');
    parshaLabel.className = 'parsha-option-label';
    parshaLabel.textContent = weeklyEntryLabel(weekEntry);
    parshaMain.appendChild(parshaLabel);
    parshaMain.addEventListener('click', (e) => {
      e.stopPropagation();
      selectedWeeklyKey = weekEntry.weekKey;
      weeklyArchiveViewMode[weekEntry.weekKey] = 'total';
      document.querySelectorAll('.merged-dropdown-list.open').forEach(l => l.classList.remove('open'));
      renderFrequentFlyerView();
    });

    const expandBtn = document.createElement('span');
    expandBtn.className = 'parsha-option-caret';
    expandBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const alreadyOpen = parshaRow.classList.contains('open');
      list.querySelectorAll('.parsha-option.open').forEach(p => p.classList.remove('open'));
      if (!alreadyOpen) parshaRow.classList.add('open');
    });
    parshaMain.appendChild(expandBtn);

    parshaRow.appendChild(parshaMain);

    const subList = document.createElement('div');
    subList.className = 'merged-dropdown-sublist';

    const addDayOption = (value, label) => {
      const isActive = isSelectedWeek && value === currentMode;
      const dayOpt = document.createElement('div');
      dayOpt.className = 'merged-dropdown-option' + (isActive ? ' merged-dropdown-option-active' : '');
      dayOpt.textContent = label;
      dayOpt.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedWeeklyKey = weekEntry.weekKey;
        weeklyArchiveViewMode[weekEntry.weekKey] = value;
        document.querySelectorAll('.merged-dropdown-list.open').forEach(l => l.classList.remove('open'));
        renderFrequentFlyerView();
      });
      subList.appendChild(dayOpt);
    };

    addDayOption('total', 'סה"כ השבוע');
    for (let i = 0; i < 7; i++){
      const d = new Date(weekStartD);
      d.setDate(d.getDate() + i);
      addDayOption(dayKeyOf(d.toISOString()), HEBREW_WEEKDAY_NAMES[i] + ' · ' + formatHebrewDateShort(d));
    }
    parshaRow.appendChild(subList);
    list.appendChild(parshaRow);
  });

  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'merged-dropdown-toggle';
  const weekStartD = new Date(selectedEntry.weekStart);
  toggle.textContent = weeklyEntryLabel(selectedEntry) + (currentMode === 'total' ? '' : ' · ' + dayLabelWithinWeek(weekStartD, currentMode));
  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.merged-dropdown-list.open').forEach(l => {
      if (l !== list) l.classList.remove('open');
    });
    list.classList.toggle('open');
  });

  const dropdown = document.createElement('div');
  dropdown.className = 'merged-dropdown';
  dropdown.appendChild(toggle);
  dropdown.appendChild(list);
  return dropdown;
}

const WEEKLY_PARENT_FIELD_DEFS = [

function fitHeaderCellToWidestWord(th){
  const label = th.dataset.fitLabel;
  if (!label) return;
  const words = label.split(' ');
  const cs = getComputedStyle(th);
  const span = document.createElement('span');
  span.style.position = 'fixed';
  span.style.top = '-9999px';
  span.style.whiteSpace = 'nowrap';
  span.style.fontFamily = cs.fontFamily;
  span.style.fontWeight = cs.fontWeight;
  span.style.fontSize = cs.fontSize;
  document.body.appendChild(span);
  let maxWordWidth = 0;
  words.forEach(w => {
    span.textContent = w;
    maxWordWidth = Math.max(maxWordWidth, span.getBoundingClientRect().width);
  });
  span.remove();
  const padding = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  const border = (parseFloat(cs.borderLeftWidth) || 0) + (parseFloat(cs.borderRightWidth) || 0);
  th.style.width = Math.ceil(maxWordWidth + padding + border + 4) + 'px';
}

function fitNamesColumnWidth(th, names){
  const cs = getComputedStyle(th);
  const tdCs = (() => {
    const table = th.closest('table');
    const sampleTd = table && table.querySelector('tbody td:first-child');
    return sampleTd ? getComputedStyle(sampleTd) : cs;
  })();
  const span = document.createElement('span');
  span.style.position = 'fixed';
  span.style.top = '-9999px';
  span.style.whiteSpace = 'nowrap';
  span.style.fontFamily = tdCs.fontFamily;
  span.style.fontWeight = tdCs.fontWeight;
  span.style.fontSize = tdCs.fontSize;
  document.body.appendChild(span);
  let maxWidth = 0;
  [th.textContent, ...names].forEach(text => {
    span.textContent = text;
    maxWidth = Math.max(maxWidth, span.getBoundingClientRect().width);
  });
  span.remove();
  const padding = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  const border = (parseFloat(cs.borderLeftWidth) || 0) + (parseFloat(cs.borderRightWidth) || 0);
  th.style.width = Math.ceil(maxWidth + padding + border + 4) + 'px';
}

let historyMergedActive = {};
let todayHistoryContainerEl = null;

function hebrewDayLetters(n){
  const ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
  const tens = ['', 'י', 'כ', 'ל'];
  if (n === 15) return 'טו';
  if (n === 16) return 'טז';
  const t = Math.floor(n / 10);
  const o = n % 10;
  return tens[t] + ones[o];
}

function formatHebrewDateShort(d, opts){
  opts = opts || {};
  const parts = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day: 'numeric', month: 'short' }).formatToParts(d);
  let day = '';
  let month = '';
  parts.forEach(p => {
    if (p.type === 'day') day = p.value;
    if (p.type === 'month') month = p.value;
  });
  const dayNum = parseInt(day, 10);
  const dayLetters = isNaN(dayNum) ? day : hebrewDayLetters(dayNum);
  return dayLetters + ' ' + month;
}

function dayKeyOf(dateStr){
  const d = new Date(dateStr);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function getHistoryActive(dayKey, groupType, defaultKey){
  const k = dayKey + '_' + groupType;
  if (!(k in historyMergedActive)) historyMergedActive[k] = defaultKey;
  return historyMergedActive[k];
}

function setHistoryActive(dayKey, groupType, key){
  historyMergedActive[dayKey + '_' + groupType] = key;
  if (todayHistoryContainerEl) renderTodayHistoryTable(todayHistoryContainerEl);
}

function buildHistoryDropdown(dayKey, groupType, options, openUp){
  const activeKey = getHistoryActive(dayKey, groupType, options[0].key);

  const list = document.createElement('div');
  list.className = 'merged-dropdown-list merged-dropdown-list-right' + (openUp ? ' merged-dropdown-list-up' : '');
  options.forEach(opt => {
    const optEl = document.createElement('div');
    optEl.className = 'merged-dropdown-option';
    optEl.textContent = opt.label;
    optEl.addEventListener('click', (e) => {
      e.stopPropagation();
      list.classList.remove('open');
      setHistoryActive(dayKey, groupType, opt.key);
    });
    list.appendChild(optEl);
  });

  const activeOpt = options.find(o => o.key === activeKey) || options[0];
  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'merged-dropdown-toggle';
  toggle.textContent = activeOpt.label;
  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.merged-dropdown-list.open').forEach(l => {
      if (l !== list) l.classList.remove('open');
    });
    list.classList.toggle('open');
  });

  const dropdown = document.createElement('div');
  dropdown.className = 'merged-dropdown';
  dropdown.appendChild(toggle);
  dropdown.appendChild(list);
  return dropdown;
}

async function exportArchiveDaysCSV(days, allOptions, groupType){
  try {
    const dayLabel = (entry) => {
      const d = new Date(entry.date);
      return formatHebrewDateShort(d) + (entry.isLive ? ' (היום)' : '');
    };
    const perDayLabels = [...CATEGORIES.map(c => c.label), '-', '🛒'];

    const headers = ['שם'];
    days.forEach(entry => {
      const dl = dayLabel(entry);
      perDayLabels.forEach(label => headers.push(dl + ' · ' + label));
    });

    const rows = [headers];
    state.students.forEach(student => {
      const row = [studentName(student.id)];
      days.forEach(entry => {
        const s = entry.students.find(x => x.id === student.id) || {};
        const cats = s.cats || {};
        CATEGORIES.forEach(c => row.push(cats[c.key] || 0));
        row.push(s.minusTotal || 0);
        row.push(-((s.purchases || 0) * PURCHASE_COST));
      });
      rows.push(row);
    });
    const csv = rows.map(row => row.map(cell => {
      const str = String(cell);
      return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
    }).join(',')).join('\r\n');

    const filename = 'ארכיון_' + todayStr() + '.csv';
    await saveCsvFile(filename, csv);
  } catch (err){
    showModal('שגיאה בהורדה: ' + (err && err.message ? err.message : String(err)), { showCancel: false, confirmText: 'הבנתי' });
  }
}

function getTodayArchiveValue(entry, studentId, activeKey){
  const s = entry.students.find(x => x.id === studentId);
  const cats = (s && s.cats) || {};
  if (activeKey === 'total') return CATEGORIES.reduce((sum, c) => sum + (cats[c.key] || 0), 0) + ((s && s.minusTotal) || 0);
  if (activeKey === 'shop') return -((s && s.purchases || 0) * PURCHASE_COST);
  if (activeKey === 'minus') return (s && s.minusTotal) || 0;
  return cats[activeKey] || 0;
}

function computeSortScore(student){
  const attendanceSum = MERGE_GROUPS[0].reduce((sum, k) => sum + (student.cats[k] || 0), 0);
  const plusGroupSum = MERGE_GROUPS[1].reduce((sum, k) => sum + (student.cats[k] || 0), 0);
  const plusPersistent = student.c5Total || 0;
  const minusOnly = student.minusTotal || 0;
  return attendanceSum + plusGroupSum + plusPersistent + minusOnly;
}

function fitAllTextCells(){
  const bodyItems = [];
  document.querySelectorAll('.num-cell .cell-text, .total-cell .cell-text, .point-val').forEach(el => {
    el.style.fontSize = '';
    const container = el.closest('td');
    if (container) bodyItems.push({ el, container });
  });

  const headerGroups = new Map();
  document.querySelectorAll('thead .col-reset-btn, thead .merged-dropdown-toggle').forEach(el => {
    el.style.fontSize = '';
    const container = el.closest('th');
    const table = el.closest('table');
    if (!container || !table) return;
    if (!headerGroups.has(table)) headerGroups.set(table, []);
    headerGroups.get(table).push({ el, container });
  });

  requestAnimationFrame(() => {
    function fitGroup(items, startSize){
      function fitsAll(size){
        return items.every(({ el, container }) => {
          const limitW = Math.max(container.clientWidth - 2, 0);
          const limitH = Math.max(container.clientHeight - 2, 0);
          return el.scrollWidth <= limitW && el.scrollHeight <= limitH;
        });
      }
      function applySize(size){
        items.forEach(({ el }) => { el.style.fontSize = size + 'px'; });
      }

      let size = startSize;
      const minSize = 8;
      applySize(size);
      let guard = 0;
      while (!fitsAll(size) && size > minSize && guard < 150){
        size -= 1;
        applySize(size);
        guard++;
      }
    }

    fitGroup(bodyItems, 90);
    headerGroups.forEach(items => fitGroup(items, 40));
  });
}

const SCREENSAVER_IDLE_MS = 30000;
const SCREENSAVER_ROTATE_MS = 20000;
const SCREENSAVER_STATES = [null, 'prayer', 'attendance'];
let screensaverIdleTimer = null;
let screensaverRotateTimer = null;
let screensaverActive = false;
let screensaverStateIndex = 0;

function currentView(){
  if (document.getElementById('metivtaView').style.display !== 'none') return 'metivta';
  return 'main';
}

// The automatic rotation only ever runs on/returns to the classroom (כיתה)
// page - it shows the live board, today's archive and the "הנוסע המתמיד"
// archive table together, since they all now live on that one page. While
// someone is on the Metivta page it does nothing, so there is no automatic
// page switching away from it.
function enterScreensaver(){
  if (screensaverActive) return;
  if (currentView() !== 'main') return;
  screensaverActive = true;
  clearTimeout(expandedGroupTimer);
  screensaverStateIndex = 0;
  expandedGroup = SCREENSAVER_STATES[screensaverStateIndex];
  render();
  screensaverRotateTimer = setInterval(() => {
    screensaverStateIndex = (screensaverStateIndex + 1) % SCREENSAVER_STATES.length;
    expandedGroup = SCREENSAVER_STATES[screensaverStateIndex];
    render();
  }, SCREENSAVER_ROTATE_MS);
}

function exitScreensaver(){
  if (!screensaverActive) return;
  screensaverActive = false;
  clearInterval(screensaverRotateTimer);
  screensaverRotateTimer = null;
  expandedGroup = null;
  render();
}

function armScreensaverIdleTimer(){
  clearTimeout(screensaverIdleTimer);
  screensaverIdleTimer = setTimeout(enterScreensaver, SCREENSAVER_IDLE_MS);
}

['mousemove', 'click', 'touchstart', 'keydown'].forEach(evt => {
  document.addEventListener(evt, () => {
    if (screensaverActive) exitScreensaver();
    armScreensaverIdleTimer();
  });
});

armScreensaverIdleTimer();

function dedupDailyArchiveEntries(){
  if (state.dailyArchiveDedupedV1) return;
  if (!Array.isArray(state.archive)) { state.dailyArchiveDedupedV1 = true; saveState(); return; }

  const byDayKey = {};
  const order = [];
  state.archive.forEach(e => {
    if (e.type === 'weekly') return;
    const k = dayKeyOf(e.date);
    if (!byDayKey[k]){ byDayKey[k] = []; order.push(k); }
    byDayKey[k].push(e);
  });

  const merged = [];
  order.forEach(k => {
    const entries = byDayKey[k];
    if (entries.length === 1){
      merged.push(entries[0]);
      return;
    }
    const base = entries[0];
    const combined = {
      date: base.date,
      students: state.students.map(s => {
        const cats = { c1: 0, c2: 0, c3: 0, c4: 0, c5: 0, c6: 0, c7: 0, c8: 0 };
        let purchases = 0, minusTotal = 0, metivtaAttendance = 0, metivtaBehavior = 0;
        entries.forEach(e => {
          const es = (e.students || []).find(x => x.id === s.id);
          if (!es) return;
          CATEGORIES.forEach(c => { cats[c.key] += (es.cats && es.cats[c.key]) || 0; });
          purchases += es.purchases || 0;
          minusTotal += es.minusTotal || 0;
          metivtaAttendance += es.metivtaAttendance || 0;
          metivtaBehavior += es.metivtaBehavior || 0;
        });
        return { id: s.id, cats, purchases, minusTotal, metivtaSum: metivtaAttendance + metivtaBehavior, metivtaAttendance, metivtaBehavior };
      }),
      metivtaExtraStudents: (state.metivtaExtra || []).map(s => {
        let metivtaAttendance = 0, metivtaBehavior = 0;
        entries.forEach(e => {
          const es = (e.metivtaExtraStudents || []).find(x => x.id === s.id);
          if (!es) return;
          metivtaAttendance += es.metivtaAttendance || 0;
          metivtaBehavior += es.metivtaBehavior || 0;
        });
        return { id: s.id, metivtaSum: metivtaAttendance + metivtaBehavior, metivtaAttendance, metivtaBehavior };
      })
    };
    merged.push(combined);
  });

  state.archive = state.archive.filter(e => e.type === 'weekly').concat(merged);
  state.dailyArchiveDedupedV1 = true;
  saveState();
}

function isEmptyDailyEntry(e){
  const allStudentsEmpty = (e.students || []).every(s => {
    const catsEmpty = !s.cats || Object.values(s.cats).every(v => !v);
    return catsEmpty && !s.purchases && !s.minusTotal && !s.metivtaAttendance && !s.metivtaBehavior;
  });
  const allExtraEmpty = (e.metivtaExtraStudents || []).every(s => !s.metivtaAttendance && !s.metivtaBehavior);
  return allStudentsEmpty && allExtraEmpty;
}

function removeEmptyPlaceholderDays(){
  if (state.emptyPlaceholdersRemovedV1) return;
  if (Array.isArray(state.archive)){
    state.archive = state.archive.filter(e => e.type === 'weekly' || !isEmptyDailyEntry(e));
  }
  state.emptyPlaceholdersRemovedV1 = true;
  saveState();
}

function importWeek20260905Data(){
  if (state.importedWeek20260905v2) return;
  if (Array.isArray(state.archive)){
    state.archive = state.archive.filter(e => !(e.type === 'weekly' && e.weekKey === '2026-09-05'));
  }
  const importData = {
    'צאלי': [0,3,2,1,2,4], 'ישרוליק': [2,3,0,2,0,4], 'נתנאל': [0,3,0,2,2,4],
    'מענדי ה.': [2,3,2,2,2,3], 'מענדי ח.': [0,3,0,2,0,4], 'אלעאי': [0,3,0,2,2,0],
    'יהונתן': [2,3,2,2,2,3], 'איתן': [0,3,0,2,2,0], 'מענדי ל.': [2,3,0,2,2,4],
    'שלוימי': [2,3,0,2,2,0], 'מוישלה': [2,3,0,2,2,4], 'לוי ס.': [2,3,2,2,2,0],
    'שמוליק ע.': [2,2,0,2,0,0], 'מולי': [0,3,0,2,2,0], 'שלום': [0,2,0,2,0,0],
    'חננאל': [2,3,2,2,2,4], 'שמוליק צ.': [0,3,2,2,2,4], 'אושר': [0,3,2,2,2,1],
    'שמעון': [2,3,2,2,2,4], 'מוטי': [2,3,2,2,2,4], 'לוי ק.': [2,1,2,2,2,0],
    'נועם': [0,3,2,2,2,4], 'משה': [2,3,2,2,0,2]
  };
  const nameToId = {};
  STUDENT_NAMES.forEach((n, idx) => { nameToId[n] = idx + 1; });
  const importWeekStartD = getWeekStart(new Date());
  const importWeekKey = getWeekKey(new Date());
  if (!Array.isArray(state.archive)) state.archive = [];
  let wEntry = state.archive.find(e => e.type === 'weekly' && e.weekKey === importWeekKey);
  if (!wEntry){
    wEntry = {
      type: 'weekly',
      title: 'הנוסע המתמיד',
      weekKey: importWeekKey,
      weekStart: importWeekStartD.toISOString(),
      date: new Date().toISOString(),
      students: []
    };
    state.archive.push(wEntry);
  }
  Object.keys(importData).forEach(name => {
    const id = nameToId[name];
    if (!id) return;
    const [morningVal, tefilaVal, mikvaotVal, bonusVal, rambamVal, metivtaVal] = importData[name];
    let ws = wEntry.students.find(x => x.id === id);
    if (!ws){
      ws = { id: id, morning: 0, tefila: 0, mikve: 0, minusDelta: 0, bonus: 0 };
      wEntry.students.push(ws);
    }
    ws.morning = morningVal;
    ws.tefila = tefilaVal;
    ws.mikvaotVal = mikvaotVal;
    ws.bonus = bonusVal;
    ws.rambamVal = rambamVal;
    ws.metivtaVal = metivtaVal;
  });
  state.importedWeek20260905v2 = true;
  saveState();
}

const ARCHIVE_ACCESS_CODE = '963';
let archiveEditUnlocked = false;
let archiveEditAccessTimer = null;

function showArchiveCodePrompt(onSuccess){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const box = document.createElement('div');
  box.className = 'modal-box';

  const msg = document.createElement('div');
  msg.className = 'modal-msg';
  msg.textContent = 'הזן קוד לעריכת ארכיון:';
  box.appendChild(msg);

  const input = document.createElement('input');
  input.type = 'password';
  input.className = 'lock-input';
  input.inputMode = 'numeric';
  input.maxLength = 10;
  input.autocomplete = 'off';
  box.appendChild(input);

  const errorEl = document.createElement('div');
  errorEl.className = 'lock-error';
  box.appendChild(errorEl);

  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btns';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'modal-btn modal-btn-cancel';
  cancelBtn.textContent = 'ביטול';
  cancelBtn.addEventListener('click', () => document.body.removeChild(overlay));
  btnRow.appendChild(cancelBtn);

  function trySubmit(){
    if (input.value.trim() === ARCHIVE_ACCESS_CODE){
      archiveEditUnlocked = true;
      document.body.removeChild(overlay);
      onSuccess();
    } else {
      errorEl.textContent = 'קוד שגוי, נסה שוב';
      input.value = '';
      input.focus();
    }
  }
  input.addEventListener('input', () => {
    if (input.value.trim() === ARCHIVE_ACCESS_CODE){
      archiveEditUnlocked = true;
      document.body.removeChild(overlay);
      onSuccess();
    }
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') trySubmit(); });

  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(() => input.focus(), 50);
}

function armArchiveEditAccessTimer(){
  clearTimeout(archiveEditAccessTimer);
  archiveEditAccessTimer = setTimeout(() => {
    archiveEditUnlocked = false;
  }, 30000);
}

function requireArchiveEditAccess(callback){
  if (archiveEditUnlocked){
    armArchiveEditAccessTimer();
    callback();
    return;
  }
  showArchiveCodePrompt(() => {
    armArchiveEditAccessTimer();
    callback();
  });
}

function promptEditArchiveValue(currentValue, onSave){
  requireArchiveEditAccess(() => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';

    const box = document.createElement('div');
    box.className = 'modal-box';

    const msg = document.createElement('div');
    msg.className = 'modal-msg';
    msg.textContent = 'ערוך ערך:';
    box.appendChild(msg);

    const input = document.createElement('input');
    input.type = 'number';
    input.className = 'lock-input';
    input.value = currentValue || 0;
    box.appendChild(input);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btns';

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'modal-btn modal-btn-cancel';
    cancelBtn.textContent = 'ביטול';
    cancelBtn.addEventListener('click', () => document.body.removeChild(overlay));
    btnRow.appendChild(cancelBtn);

    const saveBtn = document.createElement('button');
    saveBtn.className = 'modal-btn modal-btn-confirm';
    saveBtn.textContent = 'שמור';
    saveBtn.addEventListener('click', () => {
      const newVal = parseInt(input.value, 10) || 0;
      document.body.removeChild(overlay);
      onSave(newVal);
    });
    btnRow.appendChild(saveBtn);

    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    setTimeout(() => { input.focus(); input.select(); }, 50);
  });
}

function promptEditArchiveMetivtaFlags(flags, onChange){
  requireArchiveEditAccess(() => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';

    const box = document.createElement('div');
    box.className = 'modal-box';

    const msg = document.createElement('div');
    msg.className = 'modal-msg';
    msg.textContent = 'ערוך דיווח:';
    box.appendChild(msg);

    const okBtn = document.createElement('button');
    function refreshOkBtn(){
      const isPlainOk = flags.ok && !flags.late && !flags.leftEarly && !(flags.disturbCount > 0);
      okBtn.className = 'modal-btn' + (isPlainOk ? ' modal-btn-confirm' : ' modal-btn-cancel');
      okBtn.textContent = 'וי (הגיע בזמן)';
    }
    refreshOkBtn();
    okBtn.addEventListener('click', () => {
      flags.late = false;
      flags.leftEarly = false;
      flags.disturbCount = 0;
      flags.ok = true;
      refreshOkBtn();
      refreshToggleBtns();
      disturbLabel.textContent = 'הפרעות: ' + flags.disturbCount;
      onChange();
    });
    box.appendChild(okBtn);

    const toggleRow = document.createElement('div');
    toggleRow.className = 'modal-btns';
    toggleRow.style.marginTop = '10px';
    const toggleBtns = [];

    function refreshToggleBtns(){
      toggleBtns.forEach(({ btn, label, key }) => {
        btn.className = 'modal-btn' + (flags[key] ? ' modal-btn-confirm' : ' modal-btn-cancel');
        btn.textContent = label + (flags[key] ? ' ✓' : '');
      });
    }

    function buildToggleBtn(label, key){
      const btn = document.createElement('button');
      toggleBtns.push({ btn, label, key });
      btn.addEventListener('click', () => {
        flags[key] = !flags[key];
        if (flags.late || flags.leftEarly || flags.disturbCount > 0) flags.ok = false;
        refreshToggleBtns();
        refreshOkBtn();
        onChange();
      });
      return btn;
    }

    toggleRow.appendChild(buildToggleBtn('איחור', 'late'));
    toggleRow.appendChild(buildToggleBtn('יצא מוקדם', 'leftEarly'));
    refreshToggleBtns();
    box.appendChild(toggleRow);

    const disturbLabel = document.createElement('div');
    disturbLabel.className = 'modal-msg';
    disturbLabel.style.marginTop = '10px';
    disturbLabel.textContent = 'הפרעות: ' + flags.disturbCount;
    box.appendChild(disturbLabel);

    const disturbRow = document.createElement('div');
    disturbRow.className = 'modal-btns';

    const minusBtn = document.createElement('button');
    minusBtn.className = 'modal-btn modal-btn-cancel';
    minusBtn.textContent = '−';
    minusBtn.addEventListener('click', () => {
      if (flags.disturbCount > 0) flags.disturbCount--;
      disturbLabel.textContent = 'הפרעות: ' + flags.disturbCount;
      refreshOkBtn();
      onChange();
    });
    disturbRow.appendChild(minusBtn);

    const plusBtn = document.createElement('button');
    plusBtn.className = 'modal-btn modal-btn-confirm';
    plusBtn.textContent = '+';
    plusBtn.addEventListener('click', () => {
      flags.disturbCount = (flags.disturbCount || 0) + 1;
      flags.ok = false;
      disturbLabel.textContent = 'הפרעות: ' + flags.disturbCount;
      refreshOkBtn();
      onChange();
    });
    disturbRow.appendChild(plusBtn);
    box.appendChild(disturbRow);

    const closeBtn = document.createElement('button');
    closeBtn.className = 'modal-btn modal-btn-cancel';
    closeBtn.textContent = 'סגור';
    closeBtn.style.marginTop = '10px';
    closeBtn.addEventListener('click', () => document.body.removeChild(overlay));
    box.appendChild(closeBtn);

    overlay.appendChild(box);
    document.body.appendChild(overlay);
  });
}

if (isFirebaseConfigured){
  initApp();
} else {
  showSetupNeededMessage();
}
