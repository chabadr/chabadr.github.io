<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הנוסע המתמיד - עדכון הורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EA;
    --ink:#22304A;
    --ink-soft:#4B5C79;
    --line:#D9D2BC;
    --gold:#B8902E;
    --gold-bg:#FBF1D9;
    --danger:#9C3B3B;
    --danger-bg:#F5E4E1;
    --radius:10px;
  }
  * { box-sizing: border-box; }
  html, body{
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Rubik', sans-serif;
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  h1{
    font-family: 'Rubik', sans-serif;
    font-size: 22px;
    margin: 0 0 4px;
  }
  .intro{
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
    background: var(--gold-bg);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin: 14px 0;
  }
  .field{
    margin: 30px 0;
  }
  select{
    width: 100%;
    padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    font-family: 'Rubik', sans-serif;
    font-size: 15px;
    background: #fff;
  }
  .top-fields-row{
    display: flex;
    gap: 12px;
    margin: 30px 0;
  }
  .top-fields-row .field{
    flex: 1 1 0;
    min-width: 0;
    margin: 0;
  }
  .slider-field{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .slider-text{
    flex: 1;
    min-width: 0;
  }
  .slider-label{
    font-weight: 600;
    margin: 0;
  }
  .slider-note{
    font-weight: 400;
    font-size: 0.8em;
    color: var(--ink-soft);
    margin: 0;
  }
  .slider-control{
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 120px;
    width: 120px;
    margin-left: 40px;
  }
  input[type="range"]{
    flex: 1;
  }
  .slider-val{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 800;
    font-size: 20px;
    color: var(--gold);
    min-width: 28px;
    text-align: center;
  }
  .checkbox-row{
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .checkbox-row input{
    width: 22px;
    height: 22px;
  }
  .checkbox-pair-row{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 24px;
  }
  .submit-btn{
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    background: var(--gold);
    color: #fff;
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
  }
  .submit-btn:active{ transform: scale(0.98); }
  .status-msg{
    text-align: center;
    margin-top: 14px;
    font-size: 14px;
    min-height: 20px;
  }
  .status-msg.err{ color: var(--danger); }
  .error-box{
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 20px;
    font-size: 15px;
    line-height: 1.6;
    text-align: center;
  }
  .loading{
    text-align: center;
    color: var(--ink-soft);
    padding: 40px 0;
  }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="loading">טוען…</div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDocs, collection, runTransaction, addDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig, isFirebaseConfigured } from "./firebase-config.js";

// Keep this list in sync with STUDENT_NAMES in index.html.
const STUDENT_NAMES = [
  'צאלי', 'ישרוליק', 'נתנאל', 'מענדי ה.', 'מענדי ח.', 'אלעאי', 'יהונתן', 'איתן', 'מענדי ל.', 'שלוימי', 'מוישלה', 'לוי ס.',
  'שמוליק ע.', 'מולי', 'שלום', 'חננאל', 'שמוליק צ.', 'אושר', 'שמעון', 'מוטי', 'לוי ק.', 'נועם', 'משה'
];
const TOTAL_STUDENTS = STUDENT_NAMES.length;
const STORAGE_KEY = 'classroom-points-v1';
const FIRESTORE_COLLECTION = 'classroom_points';

// Sunday of the week this form launched. The week picker never offers
// anything earlier than this - there is no data to report before it existed.
const LAUNCH_WEEK_START = '2026-10-04';

function getWeekStart(date){
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay());
  return d;
}

function dateKey(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

const FIELDS = [
  { key: 'chitas', label: 'לימוד חת"ת', kind: 'slider' },
  { key: 'shema', label: 'קריאת שמע שעל המיטה', note: 'אחרי בר מצווה, עם כובע וחליפה', kind: 'slider' },
  { key: 'netilatYadaim', label: 'נטילת ידיים על יד המיטה', kind: 'slider' },
  { key: 'minchaMaariv', label: 'תפילות מנחה וערבית במניין', note: 'ושחרית בזמני חופשה', kind: 'slider' },
  { key: 'mikveh', label: 'מקווה בערב שבת', kind: 'checkbox' },
  { key: 'dvarTorah', label: 'דבר תורה בסעודת שבת', kind: 'checkbox' }
];

const app = document.getElementById('app');

function showError(msg){
  app.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'error-box';
  box.textContent = msg;
  app.appendChild(box);
}

async function fetchParshaNames(weeks){
  if (weeks.length === 0) return;
  const start = weeks[0].weekStart;
  const end = new Date(weeks[weeks.length - 1].weekStart);
  end.setDate(end.getDate() + 6);
  try{
    const url = 'https://www.hebcal.com/hebcal?cfg=json&v=1&maj=off&min=off&mod=off&nx=off&mf=off&ss=off&s=on&i=on&geo=none'
      + '&start=' + dateKey(start) + '&end=' + dateKey(end);
    const res = await fetch(url);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    const items = Array.isArray(data.items) ? data.items : [];
    weeks.forEach(w => {
      const sat = new Date(w.weekStart);
      sat.setDate(sat.getDate() + 6);
      const satKey = dateKey(sat);
      const match = items.find(it => it.category === 'parashat' && String(it.date || '').slice(0, 10) === satKey);
      if (match) w.parsha = match.hebrew || match.title;
    });
  } catch(e){
    // Best-effort only; weeks without a resolved name fall back to a date label.
  }
}

function weekLabel(w){
  if (w.parsha) return w.parsha;
  return 'שבוע ' + dateKey(w.weekStart);
}

async function main(){
  if (!isFirebaseConfigured){
    showError('האתר לא מוגדר עדיין. יש לפנות למורה.');
    return;
  }

  const params = new URLSearchParams(location.search);
  let studentId = parseInt(params.get('id'), 10);
  if (!studentId || studentId < 1 || studentId > TOTAL_STUDENTS) studentId = 1;

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);
  const weeksCollectionRef = collection(db, FIRESTORE_COLLECTION, STORAGE_KEY, 'archiveWeeks');

  // The week that's ending is added (and becomes the default) from the start
  // of Friday; until then the latest week offered is the previous one.
  const weeks = [];
  const launchStart = new Date(LAUNCH_WEEK_START + 'T00:00:00');
  const now = new Date();
  const lastWeekStart = getWeekStart(now);
  if (now.getDay() < 5) lastWeekStart.setDate(lastWeekStart.getDate() - 7);
  for (let d = new Date(launchStart); d <= lastWeekStart; d.setDate(d.getDate() + 7)){
    weeks.push({ weekStart: new Date(d), weekKey: dateKey(d), parsha: null });
  }
  await fetchParshaNames(weeks);

  let weeklyEntriesByKey = {};
  try{
    const snaps = await getDocs(weeksCollectionRef);
    snaps.forEach(s => {
      const data = s.data();
      if (data && data.weekKey) weeklyEntriesByKey[data.weekKey] = data;
    });
  } catch(e){
    showError('שגיאה בטעינת הנתונים. נסו לרענן את העמוד.');
    return;
  }

  renderForm(studentId, weeks, weeklyEntriesByKey, db);
}

function findStudentRecord(weeklyEntriesByKey, weekKey, studentId){
  const entry = weeklyEntriesByKey[weekKey];
  if (!entry || !Array.isArray(entry.students)) return null;
  return entry.students.find(s => s.id === studentId) || null;
}

function renderForm(initialStudentId, weeks, weeklyEntriesByKey, db){
  app.innerHTML = '';

  const defaultWeekIdx = Math.max(weeks.length - 1, 0);

  const h1 = document.createElement('h1');
  h1.textContent = '"הנוסע המתמיד" - עדכון הורים';
  app.appendChild(h1);

  const intro = document.createElement('div');
  intro.className = 'intro';
  const introP1 = document.createElement('p');
  introP1.style.margin = '0';
  introP1.style.fontSize = '16px';
  introP1.textContent = 'הורה יקר, מילוי המשימות חשוב מאוד, כדי שבנכם יתקדם ביראת שמים והנהגה חסידית.';
  intro.appendChild(introP1);
  const introP2 = document.createElement('p');
  introP2.style.margin = '0';
  introP2.style.fontSize = '16px';
  introP2.textContent = 'נודה מאוד על עדכון מצב מילוי המשימות בשבוע האחרון.';
  intro.appendChild(introP2);
  app.appendChild(intro);

  const topFieldsRow = document.createElement('div');
  topFieldsRow.className = 'top-fields-row';

  const nameField = document.createElement('div');
  nameField.className = 'field';
  const nameSelect = document.createElement('select');
  STUDENT_NAMES.forEach((name, idx) => {
    const opt = document.createElement('option');
    opt.value = String(idx + 1);
    opt.textContent = name;
    nameSelect.appendChild(opt);
  });
  nameSelect.value = String(initialStudentId);
  nameField.appendChild(nameSelect);
  topFieldsRow.appendChild(nameField);

  const weekField = document.createElement('div');
  weekField.className = 'field';
  const weekSelect = document.createElement('select');
  // Newest week first.
  weeks.forEach((w, idx) => {
    const opt = document.createElement('option');
    opt.value = String(idx);
    opt.textContent = weekLabel(w);
    weekSelect.prepend(opt);
  });
  weekSelect.value = String(defaultWeekIdx);
  weekField.appendChild(weekSelect);
  topFieldsRow.appendChild(weekField);

  app.appendChild(topFieldsRow);

  function currentStudentId(){
    return parseInt(nameSelect.value, 10);
  }

  const inputs = {};
  let checkboxPairRow = null;
  FIELDS.forEach(f => {
    if (f.kind === 'slider'){
      const field = document.createElement('div');
      field.className = 'field slider-field';

      const text = document.createElement('div');
      text.className = 'slider-text';
      const label = document.createElement('div');
      label.className = 'slider-label';
      label.textContent = f.label;
      text.appendChild(label);
      if (f.note){
        const noteEl = document.createElement('div');
        noteEl.className = 'slider-note';
        noteEl.textContent = f.note;
        text.appendChild(noteEl);
      }
      field.appendChild(text);

      const control = document.createElement('div');
      control.className = 'slider-control';
      const range = document.createElement('input');
      range.type = 'range';
      range.min = '0';
      range.max = '7';
      range.step = '1';
      range.value = '7';
      const valSpan = document.createElement('span');
      valSpan.className = 'slider-val';
      valSpan.textContent = range.value;
      range.addEventListener('input', () => { valSpan.textContent = range.value; });
      control.appendChild(valSpan);
      control.appendChild(range);
      field.appendChild(control);

      inputs[f.key] = range;
      app.appendChild(field);
    } else {
      if (!checkboxPairRow){
        checkboxPairRow = document.createElement('div');
        checkboxPairRow.className = 'field checkbox-pair-row';
        app.appendChild(checkboxPairRow);
      }
      const row = document.createElement('label');
      row.className = 'checkbox-row';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      row.appendChild(cb);
      const span = document.createElement('span');
      span.textContent = f.label;
      row.appendChild(span);
      checkboxPairRow.appendChild(row);
      inputs[f.key] = cb;
    }
  });

  function loadValuesForWeek(){
    const w = weeks[parseInt(weekSelect.value, 10)];
    const found = findStudentRecord(weeklyEntriesByKey, w.weekKey, currentStudentId());
    // A new week starts with these fields at 0 - until the parents (or the
    // class) fill them in, the form starts full and the parents lower it.
    const filled = found && (found.parentSubmitted || FIELDS.some(f => found[f.key]));
    const rec = filled ? found : null;
    FIELDS.forEach(f => {
      if (f.kind === 'slider'){
        const v = rec && typeof rec[f.key] === 'number' ? rec[f.key] : 7;
        inputs[f.key].value = String(v);
        inputs[f.key].previousSibling.textContent = String(v);
      } else {
        inputs[f.key].checked = rec && typeof rec[f.key] === 'boolean' ? rec[f.key] : true;
      }
    });
  }
  loadValuesForWeek();

  weekSelect.addEventListener('change', loadValuesForWeek);
  nameSelect.addEventListener('change', loadValuesForWeek);

  const submitBtn = document.createElement('button');
  submitBtn.type = 'button';
  submitBtn.className = 'submit-btn';
  submitBtn.textContent = 'שליחה';
  app.appendChild(submitBtn);

  const statusMsg = document.createElement('div');
  statusMsg.className = 'status-msg';
  app.appendChild(statusMsg);

  // Every submission is also logged to a separate collection (read only by
  // the teacher-facing admin page, never shown here to parents).
  const logCollectionRef = collection(db, FIRESTORE_COLLECTION, STORAGE_KEY, 'parentUpdateLog');

  submitBtn.addEventListener('click', async () => {
    submitBtn.disabled = true;
    statusMsg.className = 'status-msg';
    statusMsg.textContent = 'שולח…';
    const w = weeks[parseInt(weekSelect.value, 10)];
    const submitStudentId = currentStudentId();
    const values = {};
    FIELDS.forEach(f => {
      values[f.key] = f.kind === 'slider' ? parseInt(inputs[f.key].value, 10) : !!inputs[f.key].checked;
    });

    try{
      const weekRef = doc(db, FIRESTORE_COLLECTION, STORAGE_KEY, 'archiveWeeks', w.weekKey);
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(weekRef);
        let weeklyEntry = snap.exists() ? snap.data() : {
          type: 'weekly',
          title: 'הנוסע המתמיד',
          weekKey: w.weekKey,
          weekStart: w.weekStart.toISOString(),
          date: w.weekStart.toISOString(),
          students: [],
          weekParsha: null
        };
        if (!Array.isArray(weeklyEntry.students)) weeklyEntry.students = [];
        let studentRec = weeklyEntry.students.find(s => s.id === submitStudentId);
        if (!studentRec){
          studentRec = { id: submitStudentId, morning: 0, tefila: 0, mikve: 0, minusDelta: 0, bonus: 0, days: {} };
          weeklyEntry.students.push(studentRec);
        }
        Object.assign(studentRec, values, { parentSubmitted: true });
        if (w.parsha) weeklyEntry.weekParsha = w.parsha;
        tx.set(weekRef, weeklyEntry);
      });
      try{
        await addDoc(logCollectionRef, {
          studentId: submitStudentId,
          studentName: STUDENT_NAMES[submitStudentId - 1] || String(submitStudentId),
          weekKey: w.weekKey,
          weekLabel: weekLabel(w),
          values,
          submittedAt: new Date().toISOString()
        });
      } catch(e){
        // The log is a nice-to-have; never fail the submission because of it.
      }
      location.href = 'parent-update-sent.html';
      return;
    } catch(e){
      statusMsg.className = 'status-msg err';
      statusMsg.textContent = 'שגיאה בשליחה: ' + (e && e.message ? e.message : String(e));
    } finally {
      submitBtn.disabled = false;
    }
  });
}

main();
</script>
</body>
</html>
